spring:
  application:
    name: auth-service
#    import: optional:configserver:http://localhost:8888
#    import: optional:configserver:http://config-server-con:8888
  data:
    redis:
      host: localhost
      port: 6379
      database: 3
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://host.docker.internal:3306/my_restaurant_auth-service
    username: omid
    password: omid@1999
  cloud:
    config:
      enabled: false
server:
  port: 9090

#app:
#  security:
#    issuer: ${spring.application.name}
#    expire: 36000
#    secret-key: my-name-is-omid
app:
  security:
    issuer: ${spring.application.name}
    expire: 3600000  # 1 ساعت
    privateKeyPath: keys/private_key.pem
    publicKeyPath: keys/public_key.pem
